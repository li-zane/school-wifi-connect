name: Windows release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=${TAG#v}
          assets=(
            "dist/NJUSTWiFi-$version-Windows-x64-Setup.exe"
            "dist/NJUSTWiFi-$version-Windows-x64.zip"
            "dist/NJUSTWiFi-$version-source.zip"
            "dist/SHA256.json"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done

          # Do not clobber published files: clients may already have read their checksums.
          if existing=$(gh release view "$TAG" --json isDraft,isPrerelease,assets 2>/dev/null); then
            expected=$(printf '%s\n' "${assets[@]##*/}" | jq -R . | jq -s 'sort')
            jq -e --argjson expected "$expected" \
              '(.isDraft or .isPrerelease | not) and ([.assets[].name] | sort) == $expected' \
              <<<"$existing" >/dev/null || { echo 'Existing release is incomplete or not public; left unchanged.'; exit 1; }
            echo "$TAG is already published; left unchanged."
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes --title "$TAG"
          fi

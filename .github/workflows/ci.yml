name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Stable version tag to verify before publishing
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify version and optional release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = python -B -c "from njust_wifi import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Invalid application version'
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$version") { throw 'Version does not match release tag' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -q
      - name: Build installer and ZIP packages
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install-build-tools.ps1
          python -B scripts/build-release.py --installer
      - name: Verify release assets and smoke-test Setup
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*-Setup.exe
            dist/SHA256.json
